# Builds the app and publishes it to GitHub Pages (https://lykaiosnz.github.io/templing/).
# Pages source must be set to "GitHub Actions" (Settings > Pages > Build and deployment).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push supersedes a queued one, but never cancels one mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      # trims and relinks the .NET runtime, so the download is smaller
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # the version shown in Settings > About: <Version> from the csproj + the commit, so deployed builds can be told apart
      - name: Publish
        run: dotnet publish src/Templing/Templing.csproj -c Release -o publish -p:SourceRevisionId=${{ github.sha }}

      - name: Prepare site
        working-directory: publish/wwwroot
        run: |
          # served from /templing/, not the domain root
          sed -i 's|<base href="/" />|<base href="/templing/" />|' index.html
          grep -q '<base href="/templing/" />' index.html
          # Pages has no SPA fallback: its 404 page is the app, which then routes the deep link itself
          cp index.html 404.html
          # Pages serves its own compression, so the precompressed copies are dead weight
          find . -type f \( -name '*.br' -o -name '*.gz' \) -delete

      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
