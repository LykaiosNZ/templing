# Builds the app and runs the tests on every push to main and on pull requests. Deploying is pages.yml, on a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build src/Templing/Templing.csproj -c Release

      - name: Test (C#)
        run: dotnet test --project tests/Templing.Tests -c Release

      # the demo build (DEMO_MODE): its own tests; the others expect an empty store, which the demo's isn't
      - name: Test (C#, demo build)
        run: dotnet test --project tests/Templing.Tests -c Release -p:Demo=true -- --filter-class Templing.Tests.DemoDataTests

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Test (JS)
        working-directory: tests/js
        run: |
          npm ci
          npm test
