<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Templing</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- favicon.ico (16/32/48 px, rendered from icon.svg) is also what Chromium falls back to on in-app navigation;
         without it, pages opened the first time after a pushState showed no icon -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
    <link rel="stylesheet" href="css/templing#[.{fingerprint}].css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- loading screen while the app downloads; Components/BootScreen.razor takes over while the library loads -->
        <div class="boot" role="status" aria-live="polite">
            <div class="boot-card">
                <div class="boot-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 8.4 5 21h14l-3.1-10.8"/><path d="M12 18 15.7 7.4"/><path d="M15.7 7.4C12.3 8.3 9.9 6.6 9.5 3.3c3.3-.3 5.6 1.4 6.2 4.1Z" fill="currentColor" stroke="none"/><path d="M15.7 7.4c.1-3.3 2.3-5.4 5.4-5.6.2 3.1-1.9 5.3-5.4 5.6Z" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></div>
                <div class="boot-name">Templing</div>
                <div class="boot-tag">Practice tracker</div>
                <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
                <div class="boot-status boot-pct"></div>
            </div>
            <div class="boot-foot">Everything stays on this device</div>
        </div>
    </div>

    <script>
        // Light or dark (and a custom accent) from the saved settings, read straight from IndexedDB, so the loading screen matches the app.
        // Never creates the database: on a first visit the upgrade is aborted and the default (dark) stays.
        (function () {
            try {
                var q = indexedDB.open('templing');   // DB_NAME in js/db.js
                q.onupgradeneeded = function (e) { e.target.transaction.abort(); };
                q.onsuccess = function () {
                    var db = q.result;
                    try {
                        var g = db.transaction('settings').objectStore('settings').get('app');
                        g.onsuccess = function () {
                            var s = g.result, root = document.documentElement;
                            if (s && s.DarkMode === false) root.classList.add('boot-light');
                            // custom accent (Settings > Colours), so the loading screen isn't the built-in orange
                            var c = s && s.Colours;
                            if (c && c.Light && c.Light.accent) root.style.setProperty('--boot-accent-light', c.Light.accent);
                            if (c && c.Dark && c.Dark.accent) root.style.setProperty('--boot-accent-dark', c.Dark.accent);
                            db.close();
                        };
                        g.onerror = function () { db.close(); };
                    } catch (e) { db.close(); }
                };
            } catch (e) { }
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/drag.js"></script>
</body>

</html>
