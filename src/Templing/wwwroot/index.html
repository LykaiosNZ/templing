    <!-- Umami: anonymous page views and a few events (no cookies), only on the deployed site (data-domains), so dev servers
         aren't counted. Settings > Data can turn it off (AppSettings.Analytics): the script below loads the tracker only
         once the saved setting says it may, and Services/Analytics.cs turns it on or off as the setting changes.
         Ids in routes are folded (library/:id) so each screen is one page in the stats, and no ids leave the device. -->
    <script>
        // A pairing link (…/pair#<secret>, Settings > Devices): take the secret out of the address before anything else
        // sees it (the tracker, which also reports the previous address as the referrer), and keep it here for the
        // /pair page (Pages/Pair.razor). The browser may still have the link in its history, so the secret only proves
        // the pairing; the pair's key comes from what the devices then swap over the encrypted channel (js/link.js).
        var templingPairSecret = null;
        if (/\/pair\/?$/.test(location.pathname) && location.hash.length > 1) {
            templingPairSecret = location.hash.slice(1);
            history.replaceState(null, '', location.pathname);
        }
        function templingTakePairSecret() { var s = templingPairSecret; templingPairSecret = null; return s; }

        var templingAnalyticsOn = false;
        function templingUmami(type, payload) {
            if (!templingAnalyticsOn) return false;   // switched off after the tracker loaded: send nothing
            if (payload && payload.referrer) payload.referrer = payload.referrer.split(/[?#]/)[0];
            if (payload && payload.url) payload.url = payload.url.split(/[?#]/)[0].replace(/\/(library|piece|preset)\/[^/]+(\/[^/]+)?$/, function (m, kind, sub) { return '/' + kind + '/:id' + (sub ? '/:section' : ''); });
            return payload;
        }
        // on: load the tracker (once), which counts the current page; off: it stays loaded but sends nothing
        function templingAnalytics(on) {
            templingAnalyticsOn = !!on;
            if (!on || document.getElementById('umami')) return;
            var t = document.createElement('script');
            t.id = 'umami'; t.defer = true; t.src = 'https://cloud.umami.is/script.js';
            t.setAttribute('data-website-id', 'a2236001-0146-4dd6-8898-cee6ad6a1baa');
            t.setAttribute('data-domains', 'lykaiosnz.github.io');
            t.setAttribute('data-exclude-hash', 'true');   // never a fragment (a pairing link's secret) in a URL or referrer
            t.setAttribute('data-before-send', 'templingUmami');
            document.head.appendChild(t);
        }
        // custom events from Services/Analytics.cs; the tracker may not have loaded or be blocked, so this may be a no-op
        function templingTrack(name, data) { if (templingAnalyticsOn && window.umami) window.umami.track(name, data || undefined); }
    </script>
</head>

                <div class="boot-name">Templing</div>

        </div>
    </div>

    <script>
        // Light or dark (and a custom accent) from the saved settings, read straight from IndexedDB, so the loading screen matches the app.
        // Never creates the database: on a first visit the upgrade is aborted and the default (dark) stays.
        (function () {
            // Also whether to load analytics (Settings > Data): on unless the saved setting says off, as on a first visit.
            // If IndexedDB never answers, the app decides once it has loaded (Analytics.ApplyAsync).
            var decided = false;
            function analytics(on) { if (!decided) { decided = true; templingAnalytics(on); } }
            // the demo build (pages.yml marks its <html data-demo>) keeps its settings in memory, and the IndexedDB here is someone's real data
            if (document.documentElement.hasAttribute('data-demo')) { analytics(true); return; }
            try {
                var q = indexedDB.open('templing');   // DB_NAME in js/db.js
                q.onupgradeneeded = function (e) { e.target.transaction.abort(); };
                q.onerror = function () { analytics(true); };
                q.onsuccess = function () {
                    var db = q.result;
                    try {
                        var g = db.transaction('settings').objectStore('settings').get('app');
                        g.onsuccess = function () {
                            var s = g.result, root = document.documentElement;
                            analytics(!(s && s.Analytics === false));
                            if (s && s.DarkMode === false) root.classList.add('boot-light');
                            // custom accent and good colour (Settings > Colours), so the loading screen isn't the built-in orange
                            var c = s && s.Colours;
                            if (c && c.Light && c.Light.accent) root.style.setProperty('--boot-accent-light', c.Light.accent);
                            if (c && c.Dark && c.Dark.accent) root.style.setProperty('--boot-accent-dark', c.Dark.accent);
                            if (c && c.Light && c.Light.good) root.style.setProperty('--boot-good-light', c.Light.good);
                            if (c && c.Dark && c.Dark.good) root.style.setProperty('--boot-good-dark', c.Dark.good);
                            db.close();
                        };
                        g.onerror = function () { analytics(true); db.close(); };
                    } catch (e) { analytics(true); db.close(); }
                };
            } catch (e) { analytics(true); }
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
