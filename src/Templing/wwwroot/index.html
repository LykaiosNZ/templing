<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Templing</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- favicon.ico (16/32/48 px, rendered from icon.svg) is also what Chromium falls back to on in-app navigation;
         without it, pages opened the first time after a pushState showed no icon -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
    <link rel="stylesheet" href="css/templing#[.{fingerprint}].css" />
    <script type="importmap"></script>
    <!-- Umami: anonymous page views (no cookies), only on the deployed site (data-domains), so dev servers aren't counted.
         Ids in routes are folded (library/:id) so each screen is one page in the stats, and no ids leave the device. -->
    <script>
        function templingUmami(type, payload) {
            if (payload && payload.url) payload.url = payload.url.split(/[?#]/)[0].replace(/\/(library|piece|preset)\/[^/]+(\/[^/]+)?$/, function (m, kind, sub) { return '/' + kind + '/:id' + (sub ? '/:section' : ''); });
            return payload;
        }
        // custom events from Services/Analytics.cs; the tracker loads deferred and may be blocked, so this may be a no-op
        function templingTrack(name, data) { if (window.umami) window.umami.track(name, data || undefined); }
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a2236001-0146-4dd6-8898-cee6ad6a1baa" data-domains="lykaiosnz.github.io" data-before-send="templingUmami"></script>
</head>

<body>
    <div id="app">
        <!-- loading screen while the app downloads; Components/BootScreen.razor takes over while the library loads -->
        <div class="boot" role="status" aria-live="polite">
            <div class="boot-card">
                <div class="boot-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 8.4 5 21h14l-3.1-10.8"/><path d="M12 18 15.7 7.4"/><path d="M15.7 7.4C12.3 8.3 9.9 6.6 9.5 3.3c3.3-.3 5.6 1.4 6.2 4.1Z" fill="currentColor" stroke="none"/><path d="M15.7 7.4c.1-3.3 2.3-5.4 5.4-5.6.2 3.1-1.9 5.3-5.4 5.6Z" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></div>
                <div class="boot-name">Templing</div>
                <div class="boot-tag">Practice tracker</div>
                <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
                <div class="boot-status boot-pct"></div>
            </div>
            <div class="boot-foot">Grow <svg class="boot-grow" viewBox="0 0 24 24" aria-hidden="true"><path d="M2,22V20C2,20 7,18 12,18C17,18 22,20 22,20V22H2M11.3,9.1C10.1,5.2 4,6.1 4,6.1C4,6.1 4.2,13.9 9.9,12.7C9.5,9.8 8,9 8,9C10.8,9 11,12.4 11,12.4V17C11.3,17 11.7,17 12,17C12.3,17 12.7,17 13,17V12.8C13,12.8 13,8.9 16,7.9C16,7.9 14,10.9 14,12.9C21,13.6 21,4 21,4C21,4 12.1,3 11.3,9.1Z"/></svg> your tempo <svg class="boot-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 7V3H12V13.55C11.41 13.21 10.73 13 10 13C7.79 13 6 14.79 6 17S7.79 21 10 21 14 19.21 14 17V11H18V8H14V7H18Z"/></svg></div>
        </div>
    </div>

    <script>
        // Light or dark (and a custom accent) from the saved settings, read straight from IndexedDB, so the loading screen matches the app.
        // Never creates the database: on a first visit the upgrade is aborted and the default (dark) stays.
        (function () {
            // the demo build (pages.yml marks its <html data-demo>) keeps its settings in memory, and the IndexedDB here is someone's real data
            if (document.documentElement.hasAttribute('data-demo')) return;
            try {
                var q = indexedDB.open('templing');   // DB_NAME in js/db.js
                q.onupgradeneeded = function (e) { e.target.transaction.abort(); };
                q.onsuccess = function () {
                    var db = q.result;
                    try {
                        var g = db.transaction('settings').objectStore('settings').get('app');
                        g.onsuccess = function () {
                            var s = g.result, root = document.documentElement;
                            if (s && s.DarkMode === false) root.classList.add('boot-light');
                            // custom accent and good colour (Settings > Colours), so the loading screen isn't the built-in orange
                            var c = s && s.Colours;
                            if (c && c.Light && c.Light.accent) root.style.setProperty('--boot-accent-light', c.Light.accent);
                            if (c && c.Dark && c.Dark.accent) root.style.setProperty('--boot-accent-dark', c.Dark.accent);
                            if (c && c.Light && c.Light.good) root.style.setProperty('--boot-good-light', c.Light.good);
                            if (c && c.Dark && c.Dark.good) root.style.setProperty('--boot-good-dark', c.Dark.good);
                            db.close();
                        };
                        g.onerror = function () { db.close(); };
                    } catch (e) { db.close(); }
                };
            } catch (e) { }
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/drag#[.{fingerprint}].js"></script>
</body>

</html>
