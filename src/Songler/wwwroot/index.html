<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songler</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app#[.{fingerprint}].css" />
    <link rel="stylesheet" href="css/songler#[.{fingerprint}].css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- loading screen while the app downloads; Components/BootScreen.razor takes over while the library loads -->
        <div class="boot" role="status" aria-live="polite">
            <div class="boot-card">
                <div class="boot-mark" aria-hidden="true">♪</div>
                <div class="boot-name">Songler</div>
                <div class="boot-tag">Practice tracker for guitar</div>
                <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
                <div class="boot-status boot-pct"></div>
            </div>
            <div class="boot-foot">Everything stays on this device</div>
        </div>
    </div>

    <script>
        // Light or dark from the saved settings, read straight from IndexedDB, so the loading screen matches the app.
        // Never creates the database: on a first visit the upgrade is aborted and the default (dark) stays.
        (function () {
            try {
                var q = indexedDB.open('songler');
                q.onupgradeneeded = function (e) { e.target.transaction.abort(); };
                q.onsuccess = function () {
                    var db = q.result;
                    try {
                        var g = db.transaction('settings').objectStore('settings').get('app');
                        g.onsuccess = function () { if (g.result && g.result.DarkMode === false) document.documentElement.classList.add('boot-light'); db.close(); };
                        g.onerror = function () { db.close(); };
                    } catch (e) { db.close(); }
                };
            } catch (e) { }
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/drag.js"></script>
</body>

</html>
